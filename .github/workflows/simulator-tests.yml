name: Simulator tests
on:
  push:
    branches: [development/simulator]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S simulator -B build/simulator -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/simulator --config Release --parallel 2
      - run: ctest --test-dir build/simulator -C Release --output-on-failure
