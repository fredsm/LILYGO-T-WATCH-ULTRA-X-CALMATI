name: Simulator tests
on:
  workflow_dispatch:
  push:
    branches: [development/simulator]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: cmake -G Ninja -S simulator -B build/simulator -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/simulator --config Release --parallel 2 -- -k 0
      - run: ctest --test-dir build/simulator -C Release --output-on-failure
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: cmake -G Ninja -S simulator -B build/desktop -DCMAKE_BUILD_TYPE=Release -DTWATCH_DESKTOP=ON
      - run: cmake --build build/desktop --config Release --parallel 2 -- -k 0
      - run: ctest --test-dir build/desktop -C Release --output-on-failure
  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build static SDL2
        shell: pwsh
        run: |
          git clone --depth 1 --branch release-2.30.11 https://github.com/libsdl-org/SDL.git build/SDL
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S build/SDL -B build/SDL-build -A x64 -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF -DSDL_TESTS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DCMAKE_INSTALL_PREFIX=$pwd/build/SDL-install"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/SDL-build --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build/SDL-build --config Release
      - name: Configure Windows desktop
        run: cmake -S simulator -B build/desktop -A x64 -DTWATCH_DESKTOP=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DCMAKE_PREFIX_PATH=$pwd/build/SDL-install"
      - run: cmake --build build/desktop --config Release --parallel 2
      - run: ctest --test-dir build/desktop -C Release --output-on-failure
      - name: Package portable simulator
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/portable | Out-Null
          Copy-Item build/desktop/Release/twatch_desktop.exe build/portable/
          Copy-Item simulator/PORTABLE_README.txt build/portable/README.txt
          Copy-Item simulator/smoke-test.cmd build/portable/
      - uses: actions/upload-artifact@v4
        with:
          name: TWatchUltra-simulator-windows-x64
          path: build/portable/
          if-no-files-found: error
